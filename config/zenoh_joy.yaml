# ==============================================================================
# zenoh_joy_rs Production Configuration File
# ==============================================================================

# Gamepad Input Device Settings
device:
  # Search keyword in gamepad name (case-insensitive substring match).
  # Examples:
  #   - "Wireless Controller" (Sony DualSense / DualShock 4)
  #   - "Xbox"                (Microsoft Xbox One / Series Controller)
  #   - "Logitech"            (Logitech F710 / F310)
  # Leave empty ("") to automatically match the first available gamepad.
  name_keyword: ""

  # Reconnect polling interval (in milliseconds) when the controller is unplugged.
  reconnect_interval_ms: 1000

# Teleoperation & Networking Settings
network:
  # Periodic streaming frequency in Hz (typically 50 to 200 Hz).
  send_rate_hz: 100

  # Multi-Link Redundant Endpoints:
  # List all reachable robot network interfaces (Wi-Fi, Ethernet, Bluetooth PAN).
  #
  # NOTE: UDP ('udp/') is strongly recommended for real-time teleoperation to
  # prevent Head-of-Line blocking, buffer bloat, and burst delay spikes during packet drops.
  #
  # Option A: Automatic LAN Multicast Discovery (Leave empty)
  # connect_endpoints: []
  #
  # Option B: Explicit Redundant Failover with UDP (Recommended for real-time robotics)
  connect_endpoints:
    - "udp/192.168.11.100:7447" # Primary Link: Wi-Fi / Ethernet (Zero-Latency UDP)
    # - "udp/192.168.44.1:7447" # Secondary Link: Bluetooth PAN (UDP)
    # - "tcp/192.168.11.100:7447" # Fallback TCP transport if UDP is blocked by firewall

# ROS 2 Topic Settings
ros:
  # Target ROS 2 topic name (without leading slash).
  # Resulting Zenoh key expression will be: "rt/<topic_name>"
  topic_name: "joy"

  # Frame ID placed inside sensor_msgs/msg/Joy header.
  frame_id: "teleop_joy"
