[package]
name = "zenoh_joy_rs"
version = "0.1.0"
edition = "2021"
authors = ["tatsv <tatsv@users.noreply.github.com>"]
description = "Production-grade, zero-latency teleoperation controller publisher for robotics over Zenoh 1.0"
license = "MIT"
repository = "https://github.com/lazytatzv/zenoh_joy_rs"
homepage = "https://github.com/lazytatzv/zenoh_joy_rs"
documentation = "https://github.com/lazytatzv/zenoh_joy_rs"
readme = "README.md"
keywords = ["zenoh", "ros2", "teleop", "gamepad", "robotics"]
categories = ["command-line-utilities", "hardware-support"]
exclude = [
    ".github/",
    "systemd/",
    "udev/",
    "examples/",
    "install.sh",
    "Makefile"
]

[dependencies]
zenoh = "1.0.0"
evdev = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
clap = { version = "4.4", features = ["derive"] }
cdr = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.35", features = ["full"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
